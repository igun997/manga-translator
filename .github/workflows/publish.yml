name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Index to upload the build to
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run tests
        run: .venv/bin/python -m unittest discover -s tests -q

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - name: Check the bundled model ships in the wheel
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel, found {wheels}")
          names = zipfile.ZipFile(wheels[0]).namelist()
          required = ("manga_models/bubble.onnx", "manga_models/LICENSE",
                      "manga_models/NOTICE", "LICENSE")
          missing = [n for n in required if not any(x.endswith(n) for x in names)]
          if missing:
              sys.exit(f"missing from {wheels[0]}: {missing}")
          print(f"{wheels[0]} contains {len(names)} entries, model data present")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: [tests, build]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Upload
        run: uv publish

  publish-testpypi:
    name: publish to TestPyPI
    needs: [tests, build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Upload
        run: uv publish --publish-url https://test.pypi.org/legacy/
