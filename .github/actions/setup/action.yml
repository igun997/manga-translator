name: Set up test environment
description: Tesseract with language packs, DejaVu fonts, uv, and the runtime dependencies needed to run the test suite.

inputs:
  python-version:
    description: Python version for the virtual environment.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Install Tesseract and fonts
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn tesseract-ocr-jpn-vert \
          fonts-dejavu-core

    - uses: astral-sh/setup-uv@v10.2.0

    - name: Create virtual environment and install
      shell: bash
      run: |
        uv venv --python ${{ inputs.python-version }}
        # argostranslate pulls PyTorch (and CUDA wheels on Linux); the tests
        # substitute it, so install the package without its dependency set and
        # add only what the suite actually imports.
        uv pip install --no-deps -e .
        uv pip install \
          "numpy>=1.26" "opencv-python-headless>=4.11" "Pillow>=10" \
          "PyYAML>=6" "onnxruntime>=1.17,<2"
